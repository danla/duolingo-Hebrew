<style>
html,body{margin:0}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151e; --card:#17212d; --fg:#e8edf3; --muted:#95a3b3; --line:#263444;

:root[data-theme="dark"]{

  --good:#52c58a; --bad:#f0746d; --soft:#1f2b39; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 84px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top h1{font-size:20px}
header.top small{display:block;color:var(--muted);font-size:12.5px;font-family:var(--font-body);font-weight:400}
.me{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.me select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}

nav.tabs button:focus-visible,.btn:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.v{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{font-size:16px;margin-bottom:6px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:500}
.chip.city{background:var(--accent);color:var(--accent-fg)}

.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}

textarea{resize:vertical;min-height:60px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}

.hero{background:linear-gradient(160deg,#1c2a3d,#0f1a29);color:#f0f4f8;border:0;padding:18px}

.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}

.ev .ti{font-weight:700}

.pos{color:var(--good)}.neg{color:var(--bad)}

.exp:first-child{border-top:0}
.exp .a{font-family:var(--font-head);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

.shares{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid button{border:0;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--soft);cursor:pointer;position:relative}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .cap{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12px;padding:14px 8px 6px;text-align:start}
.lb img{max-height:62vh;max-width:100%;border-radius:10px;align-self:center}

details.card summary{cursor:pointer;font-family:var(--font-head);font-weight:600;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:8px}

details.card summary::after{content:"+";color:var(--muted)}
details.card[open] summary::after{content:"–"}
details.card .in{display:flex;flex-direction:column;gap:8px;margin-top:10px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
dt{color:var(--muted)}dd{margin:0}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.chk span{flex:1;min-width:0}
.banner{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.toast{position:fixed;inset:auto 0 calc(84px + env(safe-area-inset-bottom,0px)) 0;margin:auto;width:max-content;max-width:90%;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:30;font-size:14px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
